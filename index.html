<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Bau Cua 2028 Remote</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
  body { background: radial-gradient(circle at 50% 0%, #2a1e5c 0%, #0f1220 60%); color: #eee; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 18px 10px 40px; }
  .brand { font-size: 1.25rem; font-weight: 900; letter-spacing: .18em; background: linear-gradient(90deg,#ffd54a,#ff8a3d); -webkit-background-clip: text; background-clip: text; color: transparent; margin-top: 4px; }
  .brandsub { font-size: .68rem; color: #8a8fb5; letter-spacing: .3em; text-transform: uppercase; margin: 2px 0 8px; }
  .logo { width: min(300px, 80vw); margin-bottom: 4px; }
  .sub { color: #8a8fb5; font-size: .78rem; margin-bottom: 14px; }
  .card { background: rgba(24,28,48,.92); border: 1px solid #2a2f4a; border-radius: 14px; padding: 16px; width: 100%; max-width: 440px; margin-bottom: 14px; }
  .lbl { font-size: .75rem; color: #8a8fb5; text-align: center; margin-bottom: 10px; letter-spacing: .05em; }
  .die { margin-bottom: 12px; }
  .diehead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .diehead .n { font-weight: 800; color: #ffd54a; font-size: .85rem; }
  .faces { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .face { position: relative; border: 2px solid #2a2f4a; border-radius: 10px; background: #232842; padding: 3px 2px 2px; cursor: pointer; text-align: center; }
  .face img { width: 100%; border-radius: 7px; display: block; }
  .face .v { font-size: .62rem; color: #9aa0c5; font-weight: 700; }
  .face.on { border-color: #ffd54a; background: #3a3a22; }
  .face.on .v { color: #ffd54a; }
  button { background: #ffd54a; color: #1a1a1a; font-weight: 800; border: 0; border-radius: 10px; padding: 14px; font-size: 1rem; width: 100%; cursor: pointer; }
  button:active { transform: scale(.98); }
  button.ghost { background: #232842; color: #aab; margin-top: 10px; }
  .preset { display: flex; gap: 8px; margin: 4px 0 12px; }
  .preset button { background: #232842; color: #cdd; font-size: .8rem; padding: 10px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .preset button img { width: 44px; }
  .preset button.on { background: #ffd54a; color: #1a1a1a; }
  #status { margin-top: 12px; text-align: center; font-size: .85rem; color: #8a8fb5; min-height: 1.2em; }
  #status.ok { color: #7ee787; }
  #status.err { color: #ff7b72; }
  .foot { color: #55597a; font-size: .68rem; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<div class="brand">AD DIGITAL LABS</div>
<div class="brandsub">Untuk Anda kami ada</div>
<img class="logo" src="faces/tieude.png" alt="Bau Cua 2028">

<div class="sub">Kontrol dadu — sesuai wajah game asli</div>

<div class="card">
  <div class="lbl">HASIL PAKSA (PILIH WAJAH TIAP DADU)</div>
  <div id="diceRows"></div>
  <div class="lbl" style="margin-top:2px;">PRESET CEPAT</div>
  <div class="preset">
    <button onclick="preset(4,5,6)"><img src="faces/ca3d.png"><span>4·5·6<br>Ca·Cua·Tom</span></button>
    <button onclick="preset(1,1,1)"><img src="faces/nai3d.png"><span>1·1·1<br>Nai</span></button>
    <button onclick="preset(6,6,6)"><img src="faces/Tom3d.png"><span>6·6·6<br>Tom</span></button>
  </div>
  <button onclick="kirim()">KIRIM HASIL</button>
  <button class="ghost" onclick="natural()">NATURAL (hapus paksaan)</button>
  <div id="status"></div>
</div>

<div class="card">
  <div class="lbl">MODE CHINCHIRO (Supabase dice_control)</div>
  <div class="preset" style="flex-wrap: wrap;">
    <button onclick="modeChin('custom')">custom (dadu di atas)</button>
    <button onclick="modeChin('shigoro')">shigoro</button>
    <button onclick="modeChin('pinzoro')">pinzoro</button>
    <button onclick="modeChin('stop')">stop / natural</button>
  </div>
</div>
<div class="foot">BauCua2028 → Firebase bau-cua99 · ChinChiro → Supabase</div>

<script>
const FB = "https://bau-cua99-default-rtdb.asia-southeast1.firebasedatabase.app";
const SUPA = "https://whtsromktkymksuvagrw.supabase.co/rest/v1/dice_control?id=eq.1";
const SUPA_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndodHNyb21rdGt5bWtzdXZhZ3J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNTMzMTIsImV4cCI6MjEwNjkyOTMxMn0.Ey3dgYFJP0rI57eBkNtFgJjl_Qf-KI0H7dpfD_t4Kos";

// urutan wajah sesuai field DataGame game: nai, bau, ga, ca, cua, tom (nilai 1-6)
const FACES = [
  { v: 1, name: "NAI", img: "faces/nai3d.png" },
  { v: 2, name: "BAU", img: "faces/bau3d.png" },
  { v: 3, name: "GA",  img: "faces/ga3d.png"  },
  { v: 4, name: "CA",  img: "faces/ca3d.png"  },
  { v: 5, name: "CUA", img: "faces/cua3d.png" },
  { v: 6, name: "TOM", img: "faces/Tom3d.png" }
];
const picks = [1, 2, 3];

const rows = document.getElementById("diceRows");
FACES.forEach(() => {});
for (let d = 0; d < 3; d++) {
  const die = document.createElement("div");
  die.className = "die";
  const head = document.createElement("div");
  head.className = "diehead";
  head.innerHTML = '<span class="n">DADU ' + (d + 1) + '</span>';
  const grid = document.createElement("div");
  grid.className = "faces";
  for (const f of FACES) {
    const b = document.createElement("div");
    b.className = "face";
    b.innerHTML = '<img src="' + f.img + '"><div class="v">' + f.v + " " + f.name + "</div>";
    b.onclick = () => { picks[d] = f.v; render(); };
    b.dataset.v = f.v;
    b.dataset.d = d;
    grid.appendChild(b);
  }
  die.appendChild(head);
  die.appendChild(grid);
  rows.appendChild(die);
}
function render() {
  document.querySelectorAll(".face").forEach(el => {
    el.classList.toggle("on", +el.dataset.v === picks[+el.dataset.d]);
  });
}
function preset(a, b, c) { picks[0] = a; picks[1] = b; picks[2] = c; render(); }
render();

function st(msg, cls) { status.textContent = msg; status.className = cls || ""; }

async function kirim() {
  st("mengirim...");
  try {
    const body = JSON.stringify({ dice1: picks[0], dice2: picks[1], dice3: picks[2] });
    const r = await fetch(FB + "/Dice.json", { method: "PUT", headers: { "Content-Type": "application/json" }, body: body });
    if (!r.ok) throw new Error("HTTP " + r.status);
    const nm = i => FACES.find(f => f.v === picks[i]).name;
    st("✓ dikirim: " + nm(0) + " · " + nm(1) + " · " + nm(2) + " — guncang di game", "ok");
  } catch (e) { st("✗ gagal: " + e.message, "err"); }
}

async function natural() {
  st("menghapus paksaan...");
  try {
    const r = await fetch(FB + "/Dice.json", { method: "DELETE" });
    st("✓ dadu natural kembali", "ok");
  } catch (e) { st("✗ gagal: " + e.message, "err"); }
}

async function modeChin(mode) {
  st("set mode supabase: " + mode);
  const val = { mode: mode, updated_at: new Date().toISOString() };
  if (mode === "custom") { val.d1 = picks[0]; val.d2 = picks[1]; val.d3 = picks[2]; }
  else { val.d1 = 4; val.d2 = 5; val.d3 = 6; }
  try {
    const r = await fetch(SUPA, {
      method: "PATCH",
      headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
      body: JSON.stringify(val)
    });
    if (!r.ok) throw new Error("HTTP " + r.status);
    st("✓ supabase mode = " + mode, "ok");
  } catch (e) { st("✗ supabase gagal: " + e.message + " (atur manual bila perlu)", "err"); }
}
</script>
</body>
</html>
